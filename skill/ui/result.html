<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enhanced prompt</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { background: var(--result-bg); overflow: hidden; height: 100%; }
#app { position: fixed; inset: 0; }
img { -webkit-user-drag: none; user-select: none; }
/* Formatted prompt, styled like Claude's chat */
[data-rich] > :first-child { margin-top: 0; }
[data-rich] p { margin: 0 0 0.75em 0; }
[data-rich] ul, [data-rich] ol { margin: 0 0 0.75em 0; padding-left: 1.6em; }
[data-rich] li { margin: 0.2em 0; }
[data-rich] li > ul, [data-rich] li > ol { margin: 0.2em 0 0.2em 0; }
[data-rich] strong { font-weight: 600; }
[data-rich] h1, [data-rich] h2, [data-rich] h3 { font-size: 1.05em; font-weight: 600; margin: 1em 0 0.4em 0; }
[data-rich] code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; padding: 0.1em 0.35em; border-radius: 5px; background: var(--bar-on); }
[data-rich] pre { margin: 0 0 0.75em 0; padding: 10px 12px; border-radius: 10px; background: var(--bar-on); overflow-x: auto; }
[data-rich] pre code { padding: 0; background: none; font-size: 0.88em; }
[data-rich] a { color: var(--accent); text-decoration: none; }
[data-rich] hr { border: 0; border-top: 1px solid var(--divider); margin: 14px 0; }
[data-rich] blockquote { margin: 0 0 0.75em 0; padding-left: 12px; border-left: 3px solid var(--box-border); color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div ref="{{rootRef}}" tabIndex="0" onKeyDown="{{onKey}}" style="position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; outline: none; background: var(--result-bg); color: var(--text)">
<div data-handle="1" role="separator" aria-label="Drag to move · double-click to fill the screen" onPointerDown="{{handleDown}}" onDoubleClick="{{handleDbl}}" style="position: absolute; left: 50%; top: 0; width: {{handleW}}px; height: 14px; transform: translateX(-50%); display: flex; align-items: center; cursor: grab; z-index: 60"><div data-hbar="1" style="width: 100%; border-radius: 999px; background: var(--scroll-thumb); pointer-events: none"></div></div>

<div style="position: absolute; left: 24px; right: 24px; top: {{headTop}}px; height: 32px; display: flex; align-items: center; gap: 10px">
<span style="font-size: 15px; font-weight: 600; color: var(--text)">{{title}}</span>
<span style="font-size: 13px; color: var(--faint)">{{meta}}</span>
<span style="flex-grow: 1"></span>
<span aria-live="polite" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--faint)">
<sc-if value="{{isSaved}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
{{saveText}}
</span>
<sc-if value="{{canPaste}}">
<button aria-label="Paste into the Claude chat" onClick="{{paste}}" onMouseEnter="{{tp.paste.on}}" onMouseLeave="{{tp.paste.off}}" style="position: relative; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: none; border: 1px solid var(--box-border); border-radius: 999px; color: var(--text-2); font-family: inherit; font-size: 13px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path><rect x="9" y="3" width="6" height="4" rx="1"></rect><path d="M12 11v6M9.5 14.5L12 17l2.5-2.5"></path></svg>
Paste to chat
<sc-if value="{{tp.paste.show}}"><span role="tooltip" class="tip" style="top: 38px; right: 0">{{pasteTip}}</span></sc-if>
</button>
</sc-if>
</div>

<sc-if value="{{hasImgs}}">
<div style="position: absolute; left: 24px; right: 24px; top: {{imgTop}}px; height: 176px; box-sizing: border-box; padding: 10px 14px 8px 14px; display: flex; flex-direction: column; background: none; border: 1px solid var(--box-border); border-radius: 18px">
<div style="height: 34px; display: flex; align-items: center; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: var(--text-2)">Images</span>
<span style="font-size: 13px; color: var(--faint)">{{imgCount}}</span>
<sc-if value="{{hasSel}}">
<span style="font-size: 13px; color: var(--accent)">· {{selText}}</span>
<button onClick="{{clearSel}}" style="background: none; border: 0; padding: 0 4px; font-family: inherit; font-size: 13px; color: var(--faint); cursor: pointer; text-decoration: underline">Clear</button>
</sc-if>
<span style="flex-grow: 1"></span>
<button aria-label="View images full size" onClick="{{openViewBtn}}" onMouseEnter="{{tp.view.on}}" onMouseLeave="{{tp.view.off}}" style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; border-radius: 9px; color: var(--text-2); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path></svg>
<sc-if value="{{tp.view.show}}"><span role="tooltip" class="tip" style="top: 40px; right: 0">View images</span></sc-if>
</button>
<button aria-label="{{copyImgsLabel}}" onClick="{{copyImgs}}" onMouseEnter="{{tp.copyImgs.on}}" onMouseLeave="{{tp.copyImgs.off}}" style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; border-radius: 9px; color: var(--text-2); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
<sc-if value="{{tp.copyImgs.show}}"><span role="tooltip" class="tip" style="top: 40px; right: 0">{{copyImgsLabel}}</span></sc-if>
</button>
</div>
<div data-strip="1" ref="{{stripRef}}" onWheel="{{onStripWheel}}" onScroll="{{onScrollShow}}" style="flex-grow: 1; display: flex; gap: 10px; align-items: flex-start; padding-top: 6px; overflow-x: auto; overflow-y: hidden">
<sc-for list="{{thumbs}}" as="t">
<button aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" onClick="{{t.click}}" onDoubleClick="{{t.dbl}}" title="Click to select · double-click to copy the original" style="position: relative; flex-shrink: 0; width: 104px; height: 104px; box-sizing: border-box; padding: 0; overflow: hidden; border-radius: 12px; border: {{t.border}}; background: var(--stage); cursor: pointer; transition: border-color 160ms ease">
<img src="{{t.src}}" alt="" draggable="false" style="width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none">
<sc-if value="{{t.edited}}">
<span role="button" tabIndex="0" aria-pressed="{{t.editPressed}}" aria-label="{{t.editLabel}}" title="{{t.editLabel}}" onClick="{{t.toggleEdit}}" onDoubleClick="{{t.stop}}" style="position: absolute; left: 3px; bottom: 3px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: {{t.editColor}}; cursor: pointer; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.85)); transition: color 160ms ease"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></span>
</sc-if>
<sc-if value="{{t.selected}}">
<span style="position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</sc-if>
<span role="button" tabIndex="0" aria-label="View full size" title="View full size" onClick="{{t.view}}" onDoubleClick="{{t.stop}}" style="position: absolute; right: 3px; bottom: 3px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.85))"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path></svg></span></button>
</sc-for>
</div>
<div data-hthumb="1" ref="{{hThumbRef}}" aria-hidden="true" style="position: absolute; left: 14px; bottom: 3px; width: 0px; border-radius: 999px; background: var(--scroll-thumb); pointer-events: none"></div>
</div>
</sc-if>

<div style="position: absolute; left: 24px; right: 24px; top: {{promptTop}}px; bottom: 24px; box-sizing: border-box; padding: 10px 14px 14px 14px; display: flex; flex-direction: column; background: none; border: 1px solid var(--box-border); border-radius: 18px">
<div style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 10px">
<button role="switch" aria-checked="{{origStr}}" aria-label="Show the original prompt" onClick="{{togglePrompt}}" style="display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit">
<span style="position: relative; width: 34px; height: 20px; box-sizing: border-box; border-radius: 999px; background: {{sw.track}}; transition: background-color 200ms ease">
<span style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: {{sw.knob}}; transform: translateX({{sw.x}}); transition: transform 220ms cubic-bezier(0.65, 0, 0.35, 1), background-color 200ms ease"></span>
</span>
<span style="font-size: 14px; color: {{sw.label}}; transition: color 200ms ease">Original</span>
</button>
<span style="flex-grow: 1"></span>
<sc-if value="{{hasNotes}}">
<button aria-label="{{notesLabel}}" aria-expanded="{{notesStr}}" onClick="{{toggleNotes}}" style="position: relative; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: {{notesBg}}; border: 1px solid var(--box-border); border-radius: 999px; color: var(--text-2); font-family: inherit; font-size: 13px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
{{notesText}}
</button>
</sc-if>
<button aria-label="{{copyPromptLabel}}" onClick="{{copyPrompt}}" onMouseEnter="{{tp.copyPrompt.on}}" onMouseLeave="{{tp.copyPrompt.off}}" style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; border-radius: 9px; color: var(--text-2); cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
<sc-if value="{{tp.copyPrompt.show}}"><span role="tooltip" class="tip" style="top: 40px; right: 0">{{copyPromptLabel}}</span></sc-if>
</button>
</div>
<div data-prompt="1" data-rich="1" ref="{{taRef}}" contenteditable="{{editable}}" role="textbox" aria-multiline="true" aria-label="Enhanced prompt (editable)" spellcheck="true" onScroll="{{onScrollShow}}" onInput="{{onPromptInput}}" onKeyDown="{{onTaKey}}" onPaste="{{onRichPaste}}" style="display: {{taDisp}}; flex-grow: 1; min-height: 0; margin-top: 6px; box-sizing: border-box; padding: 4px 6px; outline: none; overflow-y: auto; font-size: 16px; line-height: 1.6; color: {{taColor}}; overflow-wrap: break-word"></div>
<div data-prompt="1" ref="{{origRef}}" onScroll="{{onScrollShow}}" aria-label="Original prompt (read only)" style="display: {{origDisp}}; flex-grow: 1; min-height: 0; margin-top: 6px; padding: 4px 6px; overflow-y: auto; white-space: pre-wrap; font-size: 16px; line-height: 1.6; color: var(--muted)">{{origText}}</div>
<div aria-hidden="true" style="display: {{animDisp}}; position: relative; flex-grow: 1; min-height: 0; margin-top: 6px; overflow: hidden; font-size: 16px; line-height: 1.6">
<div style="position: absolute; left: 0; right: 0; top: 0; padding: 4px 6px; color: {{anim.fromColor}}; transform: translateY({{anim.fromY}})">
<sc-for list="{{anim.from}}" as="ln"><div style="min-height: 1.6em; white-space: normal"><sc-for list="{{ln.words}}" as="w"><span style="display: inline-block; margin-right: 0.28em; opacity: {{w.op}}; transform: translateY({{w.ty}}); transition: opacity 200ms ease {{w.delay}}, transform 200ms ease {{w.delay}}">{{w.text}}</span></sc-for></div></sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; top: 0; padding: 4px 6px; color: {{anim.toColor}}">
<sc-for list="{{anim.to}}" as="ln"><div style="min-height: 1.6em; white-space: normal"><sc-for list="{{ln.words}}" as="w"><span style="display: inline-block; margin-right: 0.28em; opacity: {{w.op}}; transform: translateY({{w.ty}}); transition: opacity 220ms ease {{w.delay}}, transform 220ms ease {{w.delay}}">{{w.text}}</span></sc-for></div></sc-for>
</div>
</div>
<div data-vthumb="1" ref="{{vThumbRef}}" aria-hidden="true" style="position: absolute; right: 4px; top: 50px; height: 0px; border-radius: 999px; background: var(--scroll-thumb); pointer-events: none"></div>
<sc-if value="{{notesOpen}}">
<div data-scrollv="1" style="position: absolute; right: 14px; top: 48px; width: 360px; max-height: 60%; overflow-y: auto; box-sizing: border-box; padding: 12px 14px; background: var(--tip-bg); border: 1px solid var(--tip-border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); font-size: 13px; line-height: 1.5; color: var(--text-2); z-index: 6">
<sc-for list="{{noteSections}}" as="sec">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 2px 0 6px 0">{{sec.title}}</div>
<sc-for list="{{sec.items}}" as="it"><div style="display: flex; gap: 8px; margin-bottom: 6px"><span style="color: var(--faint)">•</span><span>{{it}}</span></div></sc-for>
<div style="height: 6px"></div>
</sc-for>
</div>
</sc-if>
</div>

<div role="status" style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%) translateY({{toastY}}); padding: 9px 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; background: var(--tip-bg); border: 1px solid var(--tip-border); border-radius: 10px; font-size: 13px; color: var(--text-2); opacity: {{toastOp}}; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease; z-index: 20">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--toast-check)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
{{toastText}}
</div>

<div aria-hidden="{{viewHidden}}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--backdrop); z-index: 10; opacity: {{viewOp}}; pointer-events: {{viewPe}}; user-select: none; -webkit-user-select: none; transition: opacity 260ms ease">
<div style="position: absolute; top: {{vTop}}px; left: 0; width: {{VW}}px; height: {{VH}}px; overflow: hidden">
<sc-for list="{{slides}}" as="sl">
<div role="img" aria-label="{{sl.label}}" onDoubleClick="{{switchOrig}}" style="position: absolute; top: 0; left: 80px; width: {{SW}}px; height: {{VH}}px; display: flex; align-items: center; justify-content: center; opacity: {{sl.op}}; transition: {{sl.tr}}; visibility: {{sl.vis}}; cursor: default; user-select: none">
<img src="{{sl.src}}" alt="" draggable="false" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; display: block">
</div>
</sc-for>
</div>

<div style="position: absolute; top: {{vLabelTop}}px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0px; background: none; border: 0; border-radius: 999px; font-size: 13px; color: var(--text-2)">
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{vLabelDot}}"></span>
{{vLabel}}
<span style="color: var(--faint)">·</span>
<span style="color: var(--faint)">{{vCount}}</span>
</div>
</div>

<button aria-label="Close viewer (Esc)" onClick="{{closeView}}" onMouseEnter="{{tp.close.on}}" onMouseLeave="{{tp.close.off}}" style="position: absolute; left: 88px; top: {{vLabelTop}}px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 999px; color: var(--chrome-fg); cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
<sc-if value="{{tp.close.show}}"><span role="tooltip" class="tip" style="top: 44px; left: 0">Close<span class="kbd">Esc</span></span></sc-if>
</button>

<div onMouseEnter="{{nearL}}" onMouseLeave="{{nearOff}}" onDoubleClick="{{zoneDbl}}" style="position: absolute; left: 0; top: {{vTop}}px; width: 170px; height: {{VH}}px; box-sizing: border-box; padding-left: 20px; display: flex; align-items: center">
<button aria-label="Previous image (←)" onClick="{{prev}}" onMouseEnter="{{tp.prev.on}}" onMouseLeave="{{tp.prev.off}}" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 999px; color: var(--chrome-fg); cursor: pointer; opacity: {{arrLOp}}; pointer-events: {{arrLPe}}; transition: opacity 180ms ease">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
<sc-if value="{{tp.prev.show}}"><span role="tooltip" class="tip" style="top: -36px; left: 50%; transform: translateX(-50%)">Previous<span class="kbd">←</span></span></sc-if>
</button>
</div>
<div onMouseEnter="{{nearR}}" onMouseLeave="{{nearOff}}" onDoubleClick="{{zoneDbl}}" style="position: absolute; right: 0; top: {{vTop}}px; width: 170px; height: {{VH}}px; box-sizing: border-box; padding-right: 20px; display: flex; align-items: center; justify-content: flex-end">
<button aria-label="Next image (→)" onClick="{{next}}" onMouseEnter="{{tp.next.on}}" onMouseLeave="{{tp.next.off}}" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 999px; color: var(--chrome-fg); cursor: pointer; opacity: {{arrROp}}; pointer-events: {{arrRPe}}; transition: opacity 180ms ease">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
<sc-if value="{{tp.next.show}}"><span role="tooltip" class="tip" style="top: -36px; left: 50%; transform: translateX(-50%)">Next<span class="kbd">→</span></span></sc-if>
</button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 13px; color: var(--faint)">{{vHint}}</div>
</div>

</div>
</template>
<script>if (/[?&]mock/.test(location.search)) document.write('<script src="dev-mock-result.js"><\/script>');</script>
<script src="dclite.js"></script>
<script src="bridge.js"></script>
<script src="md.js"></script>
<script src="richedit.js"></script>
<script src="result.js"></script>
</body>
</html>
